[project]
name = "tms-agent"
version = "0.1.0"
description = "Orchestrateur de suivi des missions de transport — détection déterministe, enquête IA"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.uv]
# Le dépôt n'est pas installé comme paquet : chaque service deviendra sa propre
# image, et les imports locaux passent par `pythonpath` (cf. [tool.pytest]).
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "services"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: nécessite le PostgreSQL local (voir scripts/test.sh)",
    "live_tms: nécessite le TMS simulé x_tms en écoute (ignoré sinon)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# `x_tms/` est un projet distinct, destiné à être extrait du dépôt : ni notre
# style ni nos règles ne s'y appliquent. L'exclure évite qu'un `ruff format .`
# lancé à la racine ne remette en forme du code dont nous ne sommes pas
# propriétaires.
extend-exclude = ["x_tms", ".venv", "database/alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplifications
    "RUF",
]

[tool.mypy]
python_version = "3.12"
exclude = ["x_tms/", "database/alembic/"]
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "."
explicit_package_bases = true
